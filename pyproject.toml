[project]
name = "hepsearch"
version = "0.1.0"
description = "Semantic search over HEP literature (INSPIRE-HEP) with Django + DRF + pgvector."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
]

# sentence-transformers pulls torch: hundreds of megabytes to low gigabytes, for a
# default test suite that never touches it (AGENTS.md §6: no test may download a model
# in the default run). It is therefore opt-in, and apps/embedding/local.py imports it
# inside a method so every other command still works without it:
#
#     uv sync --extra local-embeddings
[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.0",
]

# This is a Django application, not a distributable library: the source lives
# in apps/ and config/, not in an importable top-level "hepsearch" package.
# package = false tells uv not to try to build/install a distribution for it.
# No [build-system] table is declared for the same reason (see design.md D1).
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff format reformats fenced Python code blocks inside Markdown files. Restrict
# both linting and formatting to this project's own source so vendored/third-party
# documentation under .agents/ and .github/ (skills, agent prompts) is never
# rewritten as a side effect of running our tooling.
include = ["*.py", "*.pyi", "tests/**/*.py", "apps/**/*.py", "config/**/*.py"]

[tool.ruff.lint]
# E4/E7/E9/F: ruff defaults (pycodestyle errors + pyflakes).
# I: import sorting (replaces isort).
# UP: pyupgrade, modern 3.13 syntax.
# B: bugbear, catches mutable-default-argument and similar footguns.
# DJ: flake8-django, catches Django modelling mistakes (e.g. null=True on
#     CharField) - load-bearing given how nullable the INSPIRE data is
#     (AGENTS.md §4.2).
# RUF: ruff-specific checks.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]

[tool.pytest.ini_options]
# Nothing is installed as a package (see [tool.uv] above), so the repository
# root must be added to sys.path explicitly for `apps.*` imports to resolve.
pythonpath = ["."]
# tests/ holds project-level tests (e.g. environment smoke tests); apps/<app>/tests/
# holds per-app tests once apps/ exists (from HS-004 onward).
testpaths = ["tests", "apps"]
DJANGO_SETTINGS_MODULE = "config.settings"
markers = [
    "slow: requires a downloaded embedding model; excluded from the default run",
]
# The default run must stay fast and offline (AGENTS.md §6), so `slow` is deselected
# here rather than left to discipline. A command-line `-m` replaces this expression,
# so `uv run pytest -m slow` is the single-flag opt-in. --strict-markers turns a
# mistyped marker into an error instead of a silently-ignored decorator.
addopts = "-m 'not slow' --strict-markers"
